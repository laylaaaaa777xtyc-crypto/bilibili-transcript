[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-transcript"
version = "0.4.0"
description = "Local video transcript pipeline: subtitles-first, ASR-fallback. Bilibili supported, extensible to other sources."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28.0",
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.1.0",
    "browser-cookie3>=0.19.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
bili = "bilibili_transcript.cli:main"
bilibili-transcript = "bilibili_transcript.cli:main"
bili-web = "bilibili_transcript.web:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["bilibili_transcript*"]

[tool.setuptools.package-data]
"bilibili_transcript.presets" = ["*.json"]
"bilibili_transcript.web_static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
